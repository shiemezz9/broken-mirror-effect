<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>镜面破碎效果生成器</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --panel: #191b20;
      --panel-2: #20242b;
      --line: #343945;
      --text: #f4f5f7;
      --muted: #a9afba;
      --accent: #18c7b9;
      --accent-2: #f05365;
      --focus: #ffd166;
      --radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,.035), transparent 220px),
        radial-gradient(circle at 20% 0%, rgba(24,199,185,.14), transparent 32rem),
        #101114;
      color: var(--text);
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
      overflow: hidden;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: rgba(17, 18, 22, .92);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 0;
      overflow: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 42px;
    }

    .mark {
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255,255,255,.35);
      background:
        linear-gradient(135deg, transparent 47%, rgba(255,255,255,.75) 49%, transparent 52%),
        linear-gradient(70deg, transparent 40%, rgba(24,199,185,.9) 42%, transparent 45%),
        #181a1f;
      border-radius: 8px;
      box-shadow: inset 0 0 18px rgba(255,255,255,.08);
    }

    h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1.25;
      font-weight: 760;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .section {
      border-top: 1px solid var(--line);
      padding-top: 16px;
      display: grid;
      gap: 12px;
    }

    .section-title {
      margin: 0;
      color: #dadddf;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 740;
    }

    .file {
      display: grid;
      gap: 10px;
    }

    .file input {
      width: 100%;
      color: var(--muted);
      border: 1px dashed #515865;
      border-radius: var(--radius);
      padding: 12px;
      background: #16181d;
    }

    .control {
      display: grid;
      gap: 8px;
    }

    .control label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #dfe2e6;
      font-size: 13px;
    }

    .color-input {
      width: 100%;
      height: 42px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #14161b;
      cursor: pointer;
    }

    .value {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #14161b;
    }

    .segmented button {
      min-height: 34px;
      border: 0;
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }

    .segmented button.active {
      color: #061211;
      background: var(--accent);
      font-weight: 760;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      border-top: 1px solid var(--line);
      padding-top: 16px;
    }

    .copyright {
      margin: auto 0 0;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: #7e8794;
      font-size: 12px;
      line-height: 1.55;
      display: grid;
      gap: 6px;
    }

    .btn {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
    }

    .btn.primary {
      border-color: rgba(24,199,185,.7);
      background: var(--accent);
      color: #061211;
    }

    .btn:focus-visible,
    .segmented button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .stage {
      min-width: 0;
      min-height: 0;
      padding: 18px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 12px;
      overflow: hidden;
    }

    .toolbar {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .status {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .canvas-wrap {
      position: relative;
      min-width: 0;
      min-height: 0;
      min-height: 420px;
      border: 1px solid #2f3440;
      border-radius: var(--radius);
      overflow: hidden;
      background:
        linear-gradient(45deg, #17191e 25%, transparent 25%),
        linear-gradient(-45deg, #17191e 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #17191e 75%),
        linear-gradient(-45deg, transparent 75%, #17191e 75%),
        #111217;
      background-size: 32px 32px;
      background-position: 0 0, 0 16px, 16px -16px, -16px 0;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    .drop-note {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #d5dae2;
      pointer-events: none;
      text-align: center;
    }

    .drop-note strong {
      display: block;
      margin-bottom: 8px;
      font-size: 18px;
    }

    .drop-note span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .drop-note.hidden {
      display: none;
    }

    @media (max-width: 860px) {
      body {
        height: auto;
        min-height: 100vh;
        overflow: auto;
      }

      .app {
        grid-template-columns: 1fr;
        height: auto;
        min-height: 100vh;
        overflow: visible;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .stage {
        min-height: 68vh;
        overflow: visible;
      }

      .canvas-wrap {
        min-height: 54vh;
      }

      .actions {
        margin-top: 0;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="mark" aria-hidden="true"></div>
        <div>
          <h1>镜面破碎效果生成器</h1>
          <p class="hint">上传图片后，在画面上点击破碎中心。</p>
        </div>
      </div>

      <section class="section file">
        <p class="section-title">图片</p>
        <input id="fileInput" type="file" accept="image/*">
        <button class="btn" id="loadDemo" type="button">载入示例</button>
        <p class="hint">也可以把图片拖到右侧画布。</p>
      </section>

      <section class="section">
        <p class="section-title">裂纹</p>
        <div class="control">
          <label for="rayCount">裂纹密度 <span class="value" id="rayCountValue">18</span></label>
          <input id="rayCount" type="range" min="9" max="34" value="18">
        </div>
        <div class="control">
          <label for="breakPower">碎片位移 <span class="value" id="breakPowerValue">18</span></label>
          <input id="breakPower" type="range" min="0" max="44" value="18">
        </div>
        <div class="control">
          <label for="crackWidth">裂缝宽度 <span class="value" id="crackWidthValue">3.0</span></label>
          <input id="crackWidth" type="range" min="1" max="8" value="2.5" step="0.5">
        </div>
        <div class="control">
          <label for="impactSize">破碎点大小 <span class="value" id="impactSizeValue">8</span></label>
          <input id="impactSize" type="range" min="0.2" max="20" value="8" step="0.2">
        </div>
      </section>

      <section class="section">
        <p class="section-title">质感</p>
        <div class="segmented" aria-label="裂缝颜色">
          <button class="active" type="button" data-crack="white">白裂</button>
          <button type="button" data-crack="dark">黑裂</button>
          <button type="button" data-crack="red">红裂</button>
        </div>
        <div class="control">
          <label for="crackColor">自定义颜色 <span class="value" id="crackColorValue">#ffffff</span></label>
          <input class="color-input" id="crackColor" type="color" value="#ffffff">
        </div>
        <div class="control">
          <label for="holeColor">破洞颜色 <span class="value" id="holeColorValue">#0b0c0f</span></label>
          <input class="color-input" id="holeColor" type="color" value="#0b0c0f">
        </div>
        <div class="control">
          <label for="edgeGlow">边缘高光 <span class="value" id="edgeGlowValue">70</span></label>
          <input id="edgeGlow" type="range" min="0" max="100" value="70">
        </div>
        <div class="control">
          <label for="aberration">照片错色 <span class="value" id="aberrationValue">4</span></label>
          <input id="aberration" type="range" min="0" max="12" value="4">
        </div>
      </section>

      <div class="actions">
        <button class="btn" id="randomize" type="button">重生成</button>
        <button class="btn primary" id="download" type="button">导出 PNG</button>
      </div>
      <div class="copyright">
        <span>制作者 @shiemezz</span>
        <span>Copyright © 2026 shiemezz. 页面代码与界面设计保留作者署名。</span>
        <span>生成图片、上传图片及最终用途请由使用者自行确认授权；请勿上传或生成侵犯他人版权、肖像权、商标权或隐私权的内容。</span>
      </div>
    </aside>

    <section class="stage">
      <div class="toolbar">
        <span class="status" id="status">等待上传图片</span>
        <span id="sizeLabel">-</span>
      </div>
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="canvas"></canvas>
        <div class="drop-note" id="dropNote">
          <div>
            <strong>上传或拖入一张图片</strong>
            <span>点击画面中的任意位置，裂纹会以该点为中心向外放射，并让照片碎片产生轻微错位。</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const wrap = document.getElementById('canvasWrap');
    const dropNote = document.getElementById('dropNote');
    const statusEl = document.getElementById('status');
    const sizeLabel = document.getElementById('sizeLabel');
    const fileInput = document.getElementById('fileInput');

    const controls = {
      rayCount: document.getElementById('rayCount'),
      breakPower: document.getElementById('breakPower'),
      crackWidth: document.getElementById('crackWidth'),
      impactSize: document.getElementById('impactSize'),
      crackColor: document.getElementById('crackColor'),
      holeColor: document.getElementById('holeColor'),
      edgeGlow: document.getElementById('edgeGlow'),
      aberration: document.getElementById('aberration')
    };

    const values = {
      rayCount: document.getElementById('rayCountValue'),
      breakPower: document.getElementById('breakPowerValue'),
      crackWidth: document.getElementById('crackWidthValue'),
      impactSize: document.getElementById('impactSizeValue'),
      crackColor: document.getElementById('crackColorValue'),
      holeColor: document.getElementById('holeColorValue'),
      edgeGlow: document.getElementById('edgeGlowValue'),
      aberration: document.getElementById('aberrationValue')
    };

    let sourceImage = null;
    let fit = null;
    let center = null;
    let centerRatio = null;
    let crackTone = 'white';
    let seed = Math.floor(Math.random() * 999999);
    let shards = [];
    let crackPaths = [];
    let impactOutline = [];
    let impactCrossCracks = [];
    let lastCanvasWidth = 0;
    let lastCanvasHeight = 0;
    let resizeFrame = 0;

    function mulberry32(a) {
      return function() {
        a |= 0;
        a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function resizeCanvas() {
      const rect = wrap.getBoundingClientRect();
      const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      const cssWidth = Math.max(1, Math.round(rect.width));
      const cssHeight = Math.max(1, Math.round(rect.height));
      if (cssWidth === lastCanvasWidth && cssHeight === lastCanvasHeight) {
        return;
      }
      lastCanvasWidth = cssWidth;
      lastCanvasHeight = cssHeight;
      canvas.width = Math.max(1, Math.floor(cssWidth * dpr));
      canvas.height = Math.max(1, Math.floor(cssHeight * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    function scheduleResizeCanvas() {
      if (resizeFrame) return;
      resizeFrame = requestAnimationFrame(() => {
        resizeFrame = 0;
        resizeCanvas();
      });
    }

    function getSettings() {
      return {
        rayCount: Number(controls.rayCount.value),
        breakPower: Number(controls.breakPower.value),
        crackWidth: Number(controls.crackWidth.value),
        impactSize: Number(controls.impactSize.value),
        crackColor: controls.crackColor.value,
        holeColor: controls.holeColor.value,
        edgeGlow: Number(controls.edgeGlow.value),
        aberration: Number(controls.aberration.value)
      };
    }

    function updateValues() {
      const s = getSettings();
      values.rayCount.textContent = s.rayCount;
      values.breakPower.textContent = s.breakPower;
      values.crackWidth.textContent = s.crackWidth.toFixed(1);
      values.impactSize.textContent = s.impactSize.toFixed(1);
      values.crackColor.textContent = s.crackColor;
      values.holeColor.textContent = s.holeColor;
      values.edgeGlow.textContent = s.edgeGlow;
      values.aberration.textContent = s.aberration;
    }

    function computeFit() {
      if (!sourceImage) return null;
      const rect = wrap.getBoundingClientRect();
      const scale = Math.min(rect.width / sourceImage.width, rect.height / sourceImage.height);
      const w = sourceImage.width * scale;
      const h = sourceImage.height * scale;
      return {
        x: (rect.width - w) / 2,
        y: (rect.height - h) / 2,
        w,
        h,
        scale
      };
    }

    function imagePointFromCanvas(x, y) {
      if (!fit) return { x, y };
      return {
        x: clamp(x, fit.x, fit.x + fit.w),
        y: clamp(y, fit.y, fit.y + fit.h)
      };
    }

    function setCenterFromCanvasPoint(x, y) {
      const point = imagePointFromCanvas(x, y);
      centerRatio = {
        x: fit ? clamp((point.x - fit.x) / fit.w, 0, 1) : .5,
        y: fit ? clamp((point.y - fit.y) / fit.h, 0, 1) : .5
      };
      center = point;
    }

    function syncCenterToFit() {
      if (!fit || !centerRatio) return;
      center = {
        x: fit.x + fit.w * centerRatio.x,
        y: fit.y + fit.h * centerRatio.y
      };
    }

    function pointOnSegment(a, b, t) {
      return {
        x: a.x + (b.x - a.x) * t,
        y: a.y + (b.y - a.y) * t
      };
    }

    function pointOnPath(path, t) {
      if (path.length < 2) return path[0] || { x: 0, y: 0 };
      const lengths = [];
      let total = 0;
      for (let i = 1; i < path.length; i++) {
        const len = Math.hypot(path[i].x - path[i - 1].x, path[i].y - path[i - 1].y);
        lengths.push(len);
        total += len;
      }
      let target = clamp(t, 0, 1) * total;
      for (let i = 0; i < lengths.length; i++) {
        if (target <= lengths[i]) {
          return pointOnSegment(path[i], path[i + 1], lengths[i] ? target / lengths[i] : 0);
        }
        target -= lengths[i];
      }
      return path[path.length - 1];
    }

    function makeCurvedPath(cx, cy, angle, length, segments, rnd, curveAmount, startDistance = 0) {
      const points = [];
      const bend = (rnd() - .5) * curveAmount;
      const drift = (rnd() - .5) * curveAmount * .55;
      let lastAngle = angle;
      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const wobble = Math.sin(t * Math.PI) * bend + Math.sin(t * Math.PI * 2.1) * drift;
        lastAngle = angle + wobble + (rnd() - .5) * .026 * t;
        const distance = startDistance + length * t;
        const tangentJitter = i === 0 ? 0 : (rnd() - .5) * Math.min(18, length * .02) * t;
        const normalJitter = i === 0 ? 0 : (rnd() - .5) * Math.min(28, length * .03) * Math.sin(t * Math.PI);
        points.push({
          x: cx + Math.cos(lastAngle) * (distance + tangentJitter) + Math.cos(lastAngle + Math.PI / 2) * normalJitter,
          y: cy + Math.sin(lastAngle) * (distance + tangentJitter) + Math.sin(lastAngle + Math.PI / 2) * normalJitter,
          widthScale: 1 - t * .62 + rnd() * .08
        });
      }
      return points;
    }

    function generateCracks() {
      if (!fit || !center) return;
      const s = getSettings();
      const rnd = mulberry32(seed);
      const cx = center.x;
      const cy = center.y;
      const corners = [
        [fit.x, fit.y],
        [fit.x + fit.w, fit.y],
        [fit.x + fit.w, fit.y + fit.h],
        [fit.x, fit.y + fit.h]
      ];
      const maxR = Math.max(...corners.map(([x, y]) => Math.hypot(x - cx, y - cy))) * 1.08;
      const rayCount = s.rayCount;
      const angleBase = rnd() * Math.PI * 2;
      const impactNorm = s.impactSize / 20;
      const impactRadius = 1.2 + Math.min(fit.w, fit.h) * (.18 * impactNorm * impactNorm);
      const rings = [
        impactRadius,
        Math.max(impactRadius * 1.7, maxR * .07),
        Math.max(impactRadius * 2.5, maxR * .15),
        maxR * .28,
        maxR * .47,
        maxR * .72,
        maxR * 1.08
      ].map((v, i) => Math.max(impactRadius * .72, v + (i ? (rnd() - .5) * maxR * .025 : 0)));
      const rayPoints = [];

      for (let i = 0; i < rayCount; i++) {
        const uneven = (rnd() - .5) * .32 + Math.sin(i * 1.7) * .06;
        const angle = angleBase + (Math.PI * 2 * i / rayCount) + uneven;
        const length = maxR * (.76 + rnd() * .38);
        const basePath = makeCurvedPath(cx, cy, angle, length, rings.length - 1, rnd, .23 + rnd() * .28);
        const points = [];
        for (let r = 0; r < rings.length; r++) {
          const t = rings[r] / maxR;
          const point = pointOnPath(basePath, Math.min(1, t / 1.08));
          if (r === 0) {
            const rough = .72 + rnd() * .72;
            point.x = cx + Math.cos(angle) * impactRadius * rough;
            point.y = cy + Math.sin(angle) * impactRadius * rough;
          }
          points.push(point);
        }
        rayPoints.push(points);
      }

      shards = [];
      crackPaths = [];
      impactCrossCracks = [];
      impactOutline = rayPoints.map(points => points[0]);

      for (let i = 0; i < rayCount; i++) {
        const next = (i + 1) % rayCount;
        for (let r = 0; r < rings.length - 1; r++) {
          const poly = [
            rayPoints[i][r],
            rayPoints[i][r + 1],
            rayPoints[next][r + 1],
            rayPoints[next][r]
          ];
          const mid = centroid(poly);
          const dx = mid.x - cx;
          const dy = mid.y - cy;
          const distNorm = clamp(Math.hypot(dx, dy) / maxR, 0, 1);
          const push = s.breakPower * (.18 + distNorm) * (.45 + rnd());
          const dir = Math.atan2(dy, dx);
          shards.push({
            poly,
            tx: Math.cos(dir) * push + (rnd() - .5) * s.breakPower * .45,
            ty: Math.sin(dir) * push + (rnd() - .5) * s.breakPower * .45,
            rot: (rnd() - .5) * .028 * (1 + distNorm),
            shine: rnd(),
            dark: rnd() * .18
          });
        }
      }

      for (let i = 0; i < rayCount; i++) {
        crackPaths.push({ points: rayPoints[i], kind: i % 4 === 0 ? 'major' : 'radial', weight: .65 + rnd() * .7 });
        if (rnd() > .35) {
          const startRing = Math.floor(1 + rnd() * (rings.length - 3));
          const start = rayPoints[i][startRing];
          const baseAngle = Math.atan2(start.y - cy, start.x - cx);
          const branchAngle = baseAngle + (rnd() > .5 ? 1 : -1) * (.24 + rnd() * .42);
          const branchLen = maxR * (.08 + rnd() * .2);
          const branch = makeCurvedPath(start.x, start.y, branchAngle, branchLen, 3 + Math.floor(rnd() * 3), rnd, .18 + rnd() * .3);
          crackPaths.push({ points: branch, kind: 'branch', weight: .38 + rnd() * .48 });
        }
      }

      const webCount = Math.floor(rayCount * .48);
      for (let i = 0; i < webCount; i++) {
        const a = Math.floor(rnd() * rayCount);
        const b = (a + (rnd() > .5 ? 1 : rayCount - 1)) % rayCount;
        const t1 = .08 + rnd() * .46;
        const t2 = clamp(t1 + (rnd() - .5) * .07, .07, .58);
        const p1 = pointOnPath(rayPoints[a], t1);
        const p2 = pointOnPath(rayPoints[b], t2);
        if (Math.hypot(p2.x - p1.x, p2.y - p1.y) > maxR * .22) continue;
        const angle1 = Math.atan2(p1.y - cy, p1.x - cx);
        const angle2 = Math.atan2(p2.y - cy, p2.x - cx);
        const midAngle = Math.atan2(Math.sin(angle1) + Math.sin(angle2), Math.cos(angle1) + Math.cos(angle2));
        const midR = (Math.hypot(p1.x - cx, p1.y - cy) + Math.hypot(p2.x - cx, p2.y - cy)) * .5;
        const mid = {
          x: cx + Math.cos(midAngle) * midR * (.96 + (rnd() - .5) * .06),
          y: cy + Math.sin(midAngle) * midR * (.96 + (rnd() - .5) * .06)
        };
        crackPaths.push({ points: [p1, mid, p2], kind: 'web', weight: .18 + rnd() * .26 });
      }

      const impactCrossCount = Math.floor(rayCount * (.72 + s.impactSize / 28));
      for (let i = 0; i < impactCrossCount; i++) {
        const a = Math.floor(rnd() * rayCount);
        const b = (a + (rnd() > .5 ? 1 : rayCount - 1)) % rayCount;
        const t1 = .015 + rnd() * .16;
        const t2 = clamp(t1 + (rnd() - .5) * .045, .012, .2);
        const p1 = pointOnPath(rayPoints[a], t1);
        const p2 = pointOnPath(rayPoints[b], t2);
        const len = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        if (len > impactRadius * 2.65) continue;
        const r1 = Math.hypot(p1.x - cx, p1.y - cy);
        const r2 = Math.hypot(p2.x - cx, p2.y - cy);
        const angle1 = Math.atan2(p1.y - cy, p1.x - cx);
        const angle2 = Math.atan2(p2.y - cy, p2.x - cx);
        const midAngle = Math.atan2(Math.sin(angle1) + Math.sin(angle2), Math.cos(angle1) + Math.cos(angle2));
        const midR = (r1 + r2) * (.5 + (rnd() - .5) * .08);
        const mid = {
          x: cx + Math.cos(midAngle) * midR,
          y: cy + Math.sin(midAngle) * midR
        };
        impactCrossCracks.push({
          points: [p1, mid, p2],
          kind: 'impact-cross',
          weight: .48 + rnd() * .55
        });
      }
    }

    function centroid(poly) {
      return poly.reduce((acc, p) => {
        acc.x += p.x / poly.length;
        acc.y += p.y / poly.length;
        return acc;
      }, { x: 0, y: 0 });
    }

    function drawImageFitted() {
      if (!sourceImage || !fit) return;
      ctx.drawImage(sourceImage, fit.x, fit.y, fit.w, fit.h);
    }

    function clipImageWithTransform(poly, shard, aberration) {
      const c = centroid(poly);
      ctx.save();
      ctx.beginPath();
      poly.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
      ctx.closePath();
      ctx.clip();
      ctx.translate(c.x + shard.tx, c.y + shard.ty);
      ctx.rotate(shard.rot);
      ctx.translate(-c.x, -c.y);

      if (aberration > 0) {
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = .25;
        ctx.drawImage(sourceImage, fit.x + aberration * .5, fit.y, fit.w, fit.h);
        ctx.globalCompositeOperation = 'screen';
        ctx.globalAlpha = .18;
        ctx.drawImage(sourceImage, fit.x - aberration, fit.y + aberration * .35, fit.w, fit.h);
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
      }

      ctx.drawImage(sourceImage, fit.x, fit.y, fit.w, fit.h);

      const grad = ctx.createLinearGradient(c.x - 80, c.y - 80, c.x + 120, c.y + 140);
      grad.addColorStop(0, `rgba(255,255,255,${.04 + shard.shine * .12})`);
      grad.addColorStop(.45, 'rgba(255,255,255,0)');
      grad.addColorStop(1, `rgba(0,0,0,${shard.dark})`);
      ctx.fillStyle = grad;
      ctx.fillRect(fit.x - 20, fit.y - 20, fit.w + 40, fit.h + 40);
      ctx.restore();
    }

    function lineColors() {
      return { core: controls.crackColor.value };
    }

    function drawPolyline(points) {
      points.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    }

    function stableNoise(value) {
      return Math.abs(Math.sin(value * 12.9898 + seed * .071) * 43758.5453) % 1;
    }

    function smoothstep(t) {
      return t * t * (3 - 2 * t);
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function drawSegment(a, b, offsetX, offsetY, strokeStyle, lineWidth) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      const overlap = Math.min(1.8, Math.max(.45, lineWidth * .32));
      const ex = dx / len * overlap;
      const ey = dy / len * overlap;
      ctx.beginPath();
      ctx.moveTo(a.x - ex + offsetX, a.y - ey + offsetY);
      ctx.lineTo(b.x + ex + offsetX, b.y + ey + offsetY);
      ctx.strokeStyle = strokeStyle;
      ctx.lineWidth = lineWidth;
      ctx.lineCap = 'butt';
      ctx.stroke();
    }

    function drawCrackPath(crack, width, colors, glowAmount) {
      const points = Array.isArray(crack) ? crack : crack.points;
      if (points.length < 2) return;
      const kind = Array.isArray(crack) ? 'radial' : crack.kind;
      const weight = Array.isArray(crack) ? 1 : crack.weight;
      const kindScale = kind === 'major' ? 1.3 : kind === 'web' ? .52 : kind === 'impact-cross' ? .82 : kind === 'branch' ? .7 : 1;
      const mainWidth = Math.max(.55, width * kindScale * weight);
      const maxDim = Math.max(fit.w, fit.h);
      const nodeWidths = points.map((p, index) => {
        const distanceFromCenter = center ? Math.hypot(p.x - center.x, p.y - center.y) : maxDim;
        const taper = ['web', 'impact-cross'].includes(kind) ? .95 : clamp(distanceFromCenter / (maxDim * .22), .12, 1);
        const lowFreq = stableNoise(index * 1.73 + p.x * .003 + p.y * .004);
        const highFreq = stableNoise(index * 7.11 + p.x * .011 + p.y * .009);
        const randomWidth = .72 + lowFreq * .62 + (highFreq - .5) * .18;
        return Math.max(.34, mainWidth * taper * randomWidth);
      });
      for (let i = 1; i < nodeWidths.length - 1; i++) {
        nodeWidths[i] = nodeWidths[i - 1] * .22 + nodeWidths[i] * .56 + nodeWidths[i + 1] * .22;
      }
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      for (let i = 1; i < points.length; i++) {
        const a = points[i - 1];
        const b = points[i];
        const len = Math.hypot(b.x - a.x, b.y - a.y);
        const steps = clamp(Math.ceil(len / 34), 3, 8);
        for (let step = 0; step < steps; step++) {
          const t0 = step / steps;
          const t1 = (step + 1) / steps;
          const tm = smoothstep((t0 + t1) * .5);
          const p0 = pointOnSegment(a, b, t0);
          const p1 = pointOnSegment(a, b, t1);
          const pathT = (i - 1 + (t0 + t1) * .5) / (points.length - 1);
          const endFade = ['web', 'impact-cross'].includes(kind) ? 1 : clamp((1 - pathT) / .14, .16, 1);
          const segmentWidth = Math.max(.24, lerp(nodeWidths[i - 1], nodeWidths[i], tm) * endFade);
          drawSegment(p0, p1, 0, 0, colors.core, segmentWidth);
        }
      }
      ctx.restore();
    }

    function drawCrackRoot(crack, width, color) {
      if (Array.isArray(crack) || !['major', 'radial'].includes(crack.kind) || crack.points.length < 2) return;
      const a = crack.points[0];
      const b = crack.points[1];
      const mid = pointOnSegment(a, b, .58);
      ctx.save();
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(mid.x, mid.y);
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(.42, width * .58 * crack.weight);
      ctx.stroke();
      ctx.restore();
    }

    function drawImpactOutline(points, width, color) {
      if (!points || points.length < 3) return;
      ctx.save();
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.beginPath();
      points.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
      ctx.closePath();
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(.24, width * .12);
      ctx.stroke();
      ctx.restore();
    }

    function drawIrregularShardHighlights(shards, amount) {
      if (amount <= 0) return;
      const strength = amount / 100;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      shards.forEach((shard, shardIndex) => {
        const poly = shard.poly;
        for (let edgeIndex = 0; edgeIndex < poly.length; edgeIndex++) {
          const a = poly[edgeIndex];
          const b = poly[(edgeIndex + 1) % poly.length];
          const len = Math.hypot(b.x - a.x, b.y - a.y);
          if (len < 18) continue;
          const key = shardIndex * 17.29 + edgeIndex * 9.13 + a.x * .006 + b.y * .004;
          const mid = pointOnSegment(a, b, .5);
          const ex = (b.x - a.x) / len;
          const ey = (b.y - a.y) / len;
          const rx = center ? mid.x - center.x : 1;
          const ry = center ? mid.y - center.y : 0;
          const rLen = Math.hypot(rx, ry) || 1;
          const radialAlignment = Math.abs(ex * rx / rLen + ey * ry / rLen);
          const isRingLike = radialAlignment < .38;
          const chance = isRingLike ? (.018 + strength * .09) : (.11 + strength * .3);
          if (stableNoise(key) > chance) continue;

          const startTrim = .1 + stableNoise(key + 2.1) * .55;
          const visibleLen = (isRingLike ? .1 : .16) + stableNoise(key + 4.7) * (isRingLike ? .22 : .34);
          const endT = Math.min(.96, startTrim + visibleLen);
          if (endT <= startTrim + .06) continue;

          const p0 = pointOnSegment(a, b, startTrim);
          const p1 = pointOnSegment(a, b, endT);
          const dx = p1.x - p0.x;
          const dy = p1.y - p0.y;
          const edgeLen = Math.hypot(dx, dy) || 1;
          const nx = -dy / edgeLen;
          const ny = dx / edgeLen;
          const jitter0 = (stableNoise(key + 8.3) - .5) * 7.2;
          const jitter1 = (stableNoise(key + 11.9) - .5) * 7.2;

          ctx.beginPath();
          ctx.moveTo(p0.x + shard.tx * .12 + nx * jitter0, p0.y + shard.ty * .12 + ny * jitter0);
          ctx.lineTo(p1.x + shard.tx * .12 + nx * jitter1, p1.y + shard.ty * .12 + ny * jitter1);
          ctx.strokeStyle = `rgba(255,255,255,${(.04 + stableNoise(key + 15.2) * (isRingLike ? .12 : .28)) * strength})`;
          ctx.lineWidth = .28 + stableNoise(key + 19.6) * (isRingLike ? .55 : 1.05);
          ctx.stroke();
        }
      });
      const sparkCount = Math.floor(shards.length * strength * .16);
      for (let i = 0; i < sparkCount; i++) {
        const shard = shards[Math.floor(stableNoise(i * 21.7 + seed * .003) * shards.length)];
        if (!shard) continue;
        const c = centroid(shard.poly);
        const key = i * 31.31 + c.x * .01 + c.y * .014;
        const angle = stableNoise(key) * Math.PI * 2;
        const length = 10 + stableNoise(key + 2.4) * 44;
        const offset = (stableNoise(key + 5.7) - .5) * 28;
        const x = c.x + shard.tx * .12 + Math.cos(angle + Math.PI / 2) * offset;
        const y = c.y + shard.ty * .12 + Math.sin(angle + Math.PI / 2) * offset;
        ctx.beginPath();
        ctx.moveTo(x - Math.cos(angle) * length * .5, y - Math.sin(angle) * length * .5);
        ctx.lineTo(x + Math.cos(angle) * length * .5, y + Math.sin(angle) * length * .5);
        ctx.strokeStyle = `rgba(255,255,255,${(.035 + stableNoise(key + 8.6) * .15) * strength})`;
        ctx.lineWidth = .3 + stableNoise(key + 11.2) * .7;
        ctx.stroke();
      }
      ctx.restore();
    }

    function draw() {
      updateValues();
      const rect = wrap.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      ctx.fillStyle = '#101114';
      ctx.fillRect(0, 0, rect.width, rect.height);

      if (!sourceImage) {
        dropNote.classList.remove('hidden');
        sizeLabel.textContent = '-';
        return;
      }

      dropNote.classList.add('hidden');
      fit = computeFit();
      syncCenterToFit();
      sizeLabel.textContent = `${sourceImage.width} x ${sourceImage.height}`;

      if (!center) {
        drawImageFitted();
        statusEl.textContent = '点击图片上的破碎中心';
        return;
      }

      if (!shards.length) generateCracks();
      const s = getSettings();
      const colors = lineColors();

      ctx.save();
      ctx.fillStyle = s.holeColor;
      ctx.fillRect(fit.x - 12, fit.y - 12, fit.w + 24, fit.h + 24);
      ctx.restore();

      for (const shard of shards) {
        clipImageWithTransform(shard.poly, shard, s.aberration);
      }

      ctx.save();
      ctx.beginPath();
      ctx.rect(fit.x, fit.y, fit.w, fit.h);
      ctx.clip();

      drawIrregularShardHighlights(shards, s.edgeGlow);

      crackPaths.forEach(path => drawCrackPath(path, s.crackWidth, colors, s.edgeGlow));
      impactCrossCracks.forEach(path => drawCrackPath(path, s.crackWidth, colors, s.edgeGlow));

      crackPaths.forEach(path => drawCrackRoot(path, s.crackWidth, colors.core));
      drawImpactOutline(impactOutline, s.crackWidth, colors.core);
      ctx.restore();

      statusEl.textContent = `破碎中心：${Math.round(center.x - fit.x)}, ${Math.round(center.y - fit.y)}`;
    }

    function loadFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          sourceImage = img;
          fit = computeFit();
          centerRatio = { x: .5, y: .5 };
          syncCenterToFit();
          seed = Math.floor(Math.random() * 999999);
          shards = [];
          draw();
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    fileInput.addEventListener('change', event => loadFile(event.target.files[0]));

    document.getElementById('loadDemo').addEventListener('click', () => {
      const demo = document.createElement('canvas');
      demo.width = 960;
      demo.height = 1280;
      const d = demo.getContext('2d');
      const bg = d.createLinearGradient(0, 0, demo.width, demo.height);
      bg.addColorStop(0, '#f05365');
      bg.addColorStop(.36, '#1d202a');
      bg.addColorStop(1, '#18c7b9');
      d.fillStyle = bg;
      d.fillRect(0, 0, demo.width, demo.height);
      d.fillStyle = 'rgba(255,255,255,.82)';
      d.beginPath();
      d.ellipse(485, 455, 166, 220, -.08, 0, Math.PI * 2);
      d.fill();
      d.fillStyle = '#222733';
      d.beginPath();
      d.arc(430, 430, 18, 0, Math.PI * 2);
      d.arc(545, 425, 18, 0, Math.PI * 2);
      d.fill();
      d.strokeStyle = '#2d3340';
      d.lineWidth = 12;
      d.beginPath();
      d.moveTo(400, 560);
      d.quadraticCurveTo(485, 620, 575, 558);
      d.stroke();
      d.fillStyle = 'rgba(255,255,255,.62)';
      d.fillRect(250, 740, 470, 380);
      d.fillStyle = 'rgba(0,0,0,.38)';
      d.fillRect(330, 780, 90, 340);
      d.fillRect(560, 780, 86, 340);
      const img = new Image();
      img.onload = () => {
        sourceImage = img;
        fit = computeFit();
        centerRatio = { x: .54, y: .36 };
        syncCenterToFit();
        seed = Math.floor(Math.random() * 999999);
        shards = [];
        generateCracks();
        draw();
      };
      img.src = demo.toDataURL('image/png');
    });

    wrap.addEventListener('dragover', event => {
      event.preventDefault();
      wrap.style.borderColor = 'rgba(24,199,185,.9)';
    });

    wrap.addEventListener('dragleave', () => {
      wrap.style.borderColor = '#2f3440';
    });

    wrap.addEventListener('drop', event => {
      event.preventDefault();
      wrap.style.borderColor = '#2f3440';
      loadFile(event.dataTransfer.files[0]);
    });

    canvas.addEventListener('click', event => {
      if (!sourceImage) return;
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      setCenterFromCanvasPoint(x, y);
      seed = Math.floor(Math.random() * 999999);
      shards = [];
      generateCracks();
      draw();
    });

    for (const control of Object.values(controls).filter(control => ![controls.crackColor, controls.holeColor].includes(control))) {
      control.addEventListener('input', () => {
        shards = [];
        generateCracks();
        draw();
      });
    }

    document.querySelectorAll('[data-crack]').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('[data-crack]').forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
        crackTone = button.dataset.crack;
        const presetColors = { white: '#ffffff', dark: '#121618', red: '#a41920' };
        controls.crackColor.value = presetColors[crackTone];
        values.crackColor.textContent = controls.crackColor.value;
        draw();
      });
    });

    controls.crackColor.addEventListener('input', () => {
      document.querySelectorAll('[data-crack]').forEach(btn => btn.classList.remove('active'));
      crackTone = 'custom';
      values.crackColor.textContent = controls.crackColor.value;
      draw();
    });

    controls.crackColor.addEventListener('change', () => {
      if (!sourceImage) return;
      values.crackColor.textContent = controls.crackColor.value;
      draw();
    });

    controls.holeColor.addEventListener('input', () => {
      values.holeColor.textContent = controls.holeColor.value;
      draw();
    });

    controls.holeColor.addEventListener('change', () => {
      values.holeColor.textContent = controls.holeColor.value;
      draw();
    });

    document.getElementById('randomize').addEventListener('click', () => {
      if (!sourceImage) return;
      seed = Math.floor(Math.random() * 999999);
      shards = [];
      generateCracks();
      draw();
    });

    document.getElementById('download').addEventListener('click', () => {
      if (!sourceImage) return;
      const link = document.createElement('a');
      link.download = 'broken-mirror-effect.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    window.addEventListener('resize', () => {
      fit = computeFit();
      syncCenterToFit();
      shards = [];
      generateCracks();
      scheduleResizeCanvas();
    });

    updateValues();
    resizeCanvas();
    new ResizeObserver(scheduleResizeCanvas).observe(wrap);
  </script>
</body>
</html>
