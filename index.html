<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>镜面破碎效果生成器</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --panel: #191b20;
      --panel-2: #20242b;
      --line: #343945;
      --text: #f4f5f7;
      --muted: #a9afba;
      --accent: #18c7b9;
      --accent-2: #f05365;
      --focus: #ffd166;
      --radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,.035), transparent 220px),
        radial-gradient(circle at 20% 0%, rgba(24,199,185,.14), transparent 32rem),
        #101114;
      color: var(--text);
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
      overflow: hidden;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: rgba(17, 18, 22, .92);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 0;
      overflow: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 42px;
    }

    .mark {
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255,255,255,.35);
      background:
        linear-gradient(135deg, transparent 47%, rgba(255,255,255,.75) 49%, transparent 52%),
        linear-gradient(70deg, transparent 40%, rgba(24,199,185,.9) 42%, transparent 45%),
        #181a1f;
      border-radius: 8px;
      box-shadow: inset 0 0 18px rgba(255,255,255,.08);
    }

    h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1.25;
      font-weight: 760;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .section {
      border-top: 1px solid var(--line);
      padding-top: 16px;
      display: grid;
      gap: 12px;
    }

    .section-title {
      margin: 0;
      color: #dadddf;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 740;
    }

    .file {
      display: grid;
      gap: 10px;
    }

    .file input {
      width: 100%;
      color: var(--muted);
      border: 1px dashed #515865;
      border-radius: var(--radius);
      padding: 12px;
      background: #16181d;
    }

    .control {
      display: grid;
      gap: 8px;
    }

    .control label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #dfe2e6;
      font-size: 13px;
    }

    .color-input {
      width: 100%;
      height: 42px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #14161b;
      cursor: pointer;
    }

    .value {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #14161b;
    }

    .segmented button {
      min-height: 34px;
      border: 0;
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }

    .segmented button.active {
      color: #061211;
      background: var(--accent);
      font-weight: 760;
    }

    .impact-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .impact-tabs button {
      min-height: 32px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: #14161b;
      cursor: pointer;
      font-size: 12px;
      font-weight: 720;
    }

    .impact-tabs button.active {
      border-color: rgba(24,199,185,.8);
      color: #061211;
      background: var(--accent);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      border-top: 1px solid var(--line);
      padding-top: 16px;
    }

    .copyright {
      margin: auto 0 0;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: #7e8794;
      font-size: 12px;
      line-height: 1.55;
      display: grid;
      gap: 6px;
    }

    .btn {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
    }

    .btn.primary {
      border-color: rgba(24,199,185,.7);
      background: var(--accent);
      color: #061211;
    }

    .btn:focus-visible,
    .segmented button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .stage {
      min-width: 0;
      min-height: 0;
      padding: 18px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 12px;
      overflow: hidden;
    }

    .toolbar {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .status {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .canvas-wrap {
      position: relative;
      min-width: 0;
      min-height: 0;
      min-height: 420px;
      border: 1px solid #2f3440;
      border-radius: var(--radius);
      overflow: hidden;
      background:
        linear-gradient(45deg, #17191e 25%, transparent 25%),
        linear-gradient(-45deg, #17191e 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #17191e 75%),
        linear-gradient(-45deg, transparent 75%, #17191e 75%),
        #111217;
      background-size: 32px 32px;
      background-position: 0 0, 0 16px, 16px -16px, -16px 0;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    .drop-note {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #d5dae2;
      pointer-events: none;
      text-align: center;
    }

    .drop-note strong {
      display: block;
      margin-bottom: 8px;
      font-size: 18px;
    }

    .drop-note span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .drop-note.hidden {
      display: none;
    }

    @media (max-width: 860px) {
      body {
        height: auto;
        min-height: 100vh;
        overflow: auto;
      }

      .app {
        grid-template-columns: 1fr;
        height: auto;
        min-height: 100vh;
        overflow: visible;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .stage {
        min-height: 68vh;
        overflow: visible;
      }

      .canvas-wrap {
        min-height: 54vh;
      }

      .actions {
        margin-top: 0;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="mark" aria-hidden="true"></div>
        <div>
          <h1>镜面破碎效果生成器</h1>
          <p class="hint">上传图片后，在画面上点击破碎中心。</p>
        </div>
      </div>

      <section class="section file">
        <p class="section-title">图片</p>
        <input id="fileInput" type="file" accept="image/*">
        <button class="btn" id="loadDemo" type="button">载入示例</button>
        <p class="section-title">破碎点</p>
        <div class="impact-tabs" id="impactTabs" aria-label="破碎点列表"></div>
        <button class="btn" id="addImpact" type="button">新增破碎点</button>
        <button class="btn" id="deleteImpact" type="button">删除当前破碎点</button>
        <p class="hint">也可以把图片拖到右侧画布。</p>
      </section>

      <section class="section">
        <p class="section-title">裂纹</p>
        <div class="control">
          <label for="randomSeed">随机种子 <span class="value" id="randomSeedValue">500</span></label>
          <input id="randomSeed" type="range" min="1" max="999" value="500">
        </div>
        <div class="control">
          <label for="rayCount">裂纹密度 <span class="value" id="rayCountValue">18</span></label>
          <input id="rayCount" type="range" min="9" max="34" value="18">
        </div>
        <div class="control">
          <label for="breakPower">碎片位移 <span class="value" id="breakPowerValue">18</span></label>
          <input id="breakPower" type="range" min="0" max="44" value="18">
        </div>
        <div class="control">
          <label for="crackWidth">裂缝宽度 <span class="value" id="crackWidthValue">3.0</span></label>
          <input id="crackWidth" type="range" min="1" max="8" value="2.5" step="0.5">
        </div>
        <div class="control">
          <label for="impactSize">破碎点大小 <span class="value" id="impactSizeValue">8</span></label>
          <input id="impactSize" type="range" min="0.2" max="20" value="8" step="0.2">
        </div>
        <div class="control">
          <label for="impactSmoothness">破碎点边缘顺滑度 <span class="value" id="impactSmoothnessValue">30</span></label>
          <input id="impactSmoothness" type="range" min="0" max="100" value="30">
        </div>
      </section>

      <section class="section">
        <p class="section-title">质感</p>
        <div class="segmented" aria-label="裂缝颜色">
          <button class="active" type="button" data-crack="white">白裂</button>
          <button type="button" data-crack="dark">黑裂</button>
          <button type="button" data-crack="red">红裂</button>
        </div>
        <div class="control">
          <label for="crackColor">自定义颜色 <span class="value" id="crackColorValue">#ffffff</span></label>
          <input class="color-input" id="crackColor" type="color" value="#ffffff">
        </div>
        <div class="control">
          <label for="holeColor">破洞颜色 <span class="value" id="holeColorValue">#0b0c0f</span></label>
          <input class="color-input" id="holeColor" type="color" value="#0b0c0f">
        </div>
        <div class="control">
          <label for="edgeGlow">边缘高光 <span class="value" id="edgeGlowValue">70</span></label>
          <input id="edgeGlow" type="range" min="0" max="100" value="70">
        </div>
        <div class="control">
          <label for="aberration">照片错色 <span class="value" id="aberrationValue">4</span></label>
          <input id="aberration" type="range" min="0" max="12" value="4">
        </div>
      </section>

      <div class="actions">
        <button class="btn" id="randomize" type="button">重生成</button>
        <button class="btn primary" id="download" type="button">导出 PNG</button>
      </div>
      <div class="copyright">
        <span>制作者 @shiemezz</span>
        <span>Copyright © 2026 shiemezz. 页面代码与界面设计保留作者署名。</span>
        <span>生成图片、上传图片及最终用途请由使用者自行确认授权；请勿上传或生成侵犯他人版权、肖像权、商标权或隐私权的内容。</span>
      </div>
    </aside>

    <section class="stage">
      <div class="toolbar">
        <span class="status" id="status">等待上传图片</span>
        <span id="sizeLabel">-</span>
      </div>
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="canvas"></canvas>
        <div class="drop-note" id="dropNote">
          <div>
            <strong>上传或拖入一张图片</strong>
            <span>点击画面中的任意位置，裂纹会以该点为中心向外放射，并让照片碎片产生轻微错位。</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const wrap = document.getElementById('canvasWrap');
    const dropNote = document.getElementById('dropNote');
    const statusEl = document.getElementById('status');
    const sizeLabel = document.getElementById('sizeLabel');
    const fileInput = document.getElementById('fileInput');
    const impactTabs = document.getElementById('impactTabs');
    const addImpact = document.getElementById('addImpact');
    const deleteImpact = document.getElementById('deleteImpact');

    const controls = {
      rayCount: document.getElementById('rayCount'),
      breakPower: document.getElementById('breakPower'),
      crackWidth: document.getElementById('crackWidth'),
      impactSize: document.getElementById('impactSize'),
      impactSmoothness: document.getElementById('impactSmoothness'),
      randomSeed: document.getElementById('randomSeed'),
      crackColor: document.getElementById('crackColor'),
      holeColor: document.getElementById('holeColor'),
      edgeGlow: document.getElementById('edgeGlow'),
      aberration: document.getElementById('aberration')
    };

    const values = {
      rayCount: document.getElementById('rayCountValue'),
      breakPower: document.getElementById('breakPowerValue'),
      crackWidth: document.getElementById('crackWidthValue'),
      impactSize: document.getElementById('impactSizeValue'),
      impactSmoothness: document.getElementById('impactSmoothnessValue'),
      randomSeed: document.getElementById('randomSeedValue'),
      crackColor: document.getElementById('crackColorValue'),
      holeColor: document.getElementById('holeColorValue'),
      edgeGlow: document.getElementById('edgeGlowValue'),
      aberration: document.getElementById('aberrationValue')
    };

    let sourceImage = null;
    let fit = null;
    let center = null;
    let centers = [];
    let centerRatios = [];
    let impactSettings = [];
    let selectedImpactIndex = -1;
    let addingImpact = false;
    let crackTone = 'white';
    let seed = Math.floor(Math.random() * 999999);
    let shards = [];
    let crackPaths = [];
    let impactOutlines = [];
    let impactCrossCracks = [];
    let lastCanvasWidth = 0;
    let lastCanvasHeight = 0;
    let resizeFrame = 0;

    function mulberry32(a) {
      return function() {
        a |= 0;
        a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function resizeCanvas() {
      const rect = wrap.getBoundingClientRect();
      const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      const cssWidth = Math.max(1, Math.round(rect.width));
      const cssHeight = Math.max(1, Math.round(rect.height));
      if (cssWidth === lastCanvasWidth && cssHeight === lastCanvasHeight) {
        return;
      }
      lastCanvasWidth = cssWidth;
      lastCanvasHeight = cssHeight;
      canvas.width = Math.max(1, Math.floor(cssWidth * dpr));
      canvas.height = Math.max(1, Math.floor(cssHeight * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    function scheduleResizeCanvas() {
      if (resizeFrame) return;
      resizeFrame = requestAnimationFrame(() => {
        resizeFrame = 0;
        resizeCanvas();
      });
    }

    function getSettings() {
      return {
        rayCount: Number(controls.rayCount.value),
        breakPower: Number(controls.breakPower.value),
        crackWidth: Number(controls.crackWidth.value),
        impactSize: Number(controls.impactSize.value),
        impactSmoothness: Number(controls.impactSmoothness.value),
        randomSeed: Number(controls.randomSeed.value),
        crackColor: controls.crackColor.value,
        holeColor: controls.holeColor.value,
        edgeGlow: Number(controls.edgeGlow.value),
        aberration: Number(controls.aberration.value)
      };
    }

    function getSelectedSettings() {
      if (selectedImpactIndex === -1 && impactSettings.length) return impactSettings[0];
      return impactSettings[selectedImpactIndex] || getSettings();
    }

    function cloneSettings(settings) {
      return { ...settings };
    }

    function setControlsFromSettings(settings) {
      controls.rayCount.value = settings.rayCount;
      controls.breakPower.value = settings.breakPower;
      controls.crackWidth.value = settings.crackWidth;
      controls.impactSize.value = settings.impactSize;
      controls.impactSmoothness.value = settings.impactSmoothness;
      controls.randomSeed.value = settings.randomSeed;
      controls.crackColor.value = settings.crackColor;
      controls.holeColor.value = settings.holeColor;
      controls.edgeGlow.value = settings.edgeGlow;
      controls.aberration.value = settings.aberration;
      updateValues();
    }

    function saveSelectedSettings() {
      if (selectedImpactIndex === -1) {
        const settings = getSettings();
        impactSettings = impactSettings.map(() => cloneSettings(settings));
        return;
      }
      if (selectedImpactIndex < 0) return;
      impactSettings[selectedImpactIndex] = getSettings();
    }

    function renderImpactTabs() {
      impactTabs.innerHTML = '';
      const allButton = document.createElement('button');
      allButton.type = 'button';
      allButton.textContent = '所有破碎点';
      allButton.className = selectedImpactIndex === -1 ? 'active' : '';
      allButton.disabled = !centers.length;
      allButton.addEventListener('click', () => {
        selectedImpactIndex = -1;
        addingImpact = true;
        setControlsFromSettings(getSelectedSettings());
        renderImpactTabs();
        draw();
      });
      impactTabs.appendChild(allButton);
      centers.forEach((_, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = `破碎点 ${index + 1}`;
        button.className = index === selectedImpactIndex ? 'active' : '';
        button.addEventListener('click', () => {
          selectedImpactIndex = index;
          addingImpact = false;
          setControlsFromSettings(getSelectedSettings());
          renderImpactTabs();
          draw();
        });
        impactTabs.appendChild(button);
      });
      addImpact.textContent = addingImpact ? '点击画面放置新破碎点' : '新增破碎点';
      deleteImpact.disabled = centers.length <= 1 || selectedImpactIndex === -1 || addingImpact;
    }

    function updateValues() {
      const s = getSettings();
      values.rayCount.textContent = s.rayCount;
      values.breakPower.textContent = s.breakPower;
      values.crackWidth.textContent = s.crackWidth.toFixed(1);
      values.impactSize.textContent = s.impactSize.toFixed(1);
      values.impactSmoothness.textContent = s.impactSmoothness;
      values.randomSeed.textContent = s.randomSeed;
      values.crackColor.textContent = s.crackColor;
      values.holeColor.textContent = s.holeColor;
      values.edgeGlow.textContent = s.edgeGlow;
      values.aberration.textContent = s.aberration;
    }

    function computeFit() {
      if (!sourceImage) return null;
      const rect = wrap.getBoundingClientRect();
      const scale = Math.min(rect.width / sourceImage.width, rect.height / sourceImage.height);
      const w = sourceImage.width * scale;
      const h = sourceImage.height * scale;
      return {
        x: (rect.width - w) / 2,
        y: (rect.height - h) / 2,
        w,
        h,
        scale
      };
    }

    function imagePointFromCanvas(x, y) {
      if (!fit) return { x, y };
      return {
        x: clamp(x, fit.x, fit.x + fit.w),
        y: clamp(y, fit.y, fit.y + fit.h)
      };
    }

    function addCenterFromCanvasPoint(x, y) {
      const point = imagePointFromCanvas(x, y);
      const ratio = {
        x: fit ? clamp((point.x - fit.x) / fit.w, 0, 1) : .5,
        y: fit ? clamp((point.y - fit.y) / fit.h, 0, 1) : .5
      };
      centerRatios.push(ratio);
      centers.push(point);
      center = point;
      impactSettings.push(cloneSettings(getSettings()));
      selectedImpactIndex = centers.length - 1;
      addingImpact = false;
      renderImpactTabs();
    }

    function moveSelectedCenterToCanvasPoint(x, y) {
      if (selectedImpactIndex < 0 || !centerRatios[selectedImpactIndex]) return;
      const point = imagePointFromCanvas(x, y);
      centerRatios[selectedImpactIndex] = {
        x: fit ? clamp((point.x - fit.x) / fit.w, 0, 1) : .5,
        y: fit ? clamp((point.y - fit.y) / fit.h, 0, 1) : .5
      };
      syncCenterToFit();
      center = centers[selectedImpactIndex] || null;
    }

    function syncCenterToFit() {
      if (!fit || !centerRatios.length) return;
      centers = centerRatios.map(ratio => ({
        x: fit.x + fit.w * ratio.x,
        y: fit.y + fit.h * ratio.y
      }));
      selectedImpactIndex = clamp(selectedImpactIndex, 0, centers.length - 1);
      center = centers[selectedImpactIndex] || centers[centers.length - 1] || null;
    }

    function pointOnSegment(a, b, t) {
      return {
        x: a.x + (b.x - a.x) * t,
        y: a.y + (b.y - a.y) * t
      };
    }

    function pointOnPath(path, t) {
      if (path.length < 2) return path[0] || { x: 0, y: 0 };
      const lengths = [];
      let total = 0;
      for (let i = 1; i < path.length; i++) {
        const len = Math.hypot(path[i].x - path[i - 1].x, path[i].y - path[i - 1].y);
        lengths.push(len);
        total += len;
      }
      let target = clamp(t, 0, 1) * total;
      for (let i = 0; i < lengths.length; i++) {
        if (target <= lengths[i]) {
          return pointOnSegment(path[i], path[i + 1], lengths[i] ? target / lengths[i] : 0);
        }
        target -= lengths[i];
      }
      return path[path.length - 1];
    }

    function makeCurvedPath(cx, cy, angle, length, segments, rnd, curveAmount, startDistance = 0) {
      const points = [];
      const bend = (rnd() - .5) * curveAmount;
      const drift = (rnd() - .5) * curveAmount * .55;
      let lastAngle = angle;
      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const wobble = Math.sin(t * Math.PI) * bend + Math.sin(t * Math.PI * 2.1) * drift;
        lastAngle = angle + wobble + (rnd() - .5) * .026 * t;
        const distance = startDistance + length * t;
        const tangentJitter = i === 0 ? 0 : (rnd() - .5) * Math.min(18, length * .02) * t;
        const normalJitter = i === 0 ? 0 : (rnd() - .5) * Math.min(28, length * .03) * Math.sin(t * Math.PI);
        points.push({
          x: cx + Math.cos(lastAngle) * (distance + tangentJitter) + Math.cos(lastAngle + Math.PI / 2) * normalJitter,
          y: cy + Math.sin(lastAngle) * (distance + tangentJitter) + Math.sin(lastAngle + Math.PI / 2) * normalJitter,
          widthScale: 1 - t * .62 + rnd() * .08
        });
      }
      return points;
    }

    function generateCracks() {
      if (!fit || !centers.length) return;
      shards = [];
      crackPaths = [];
      impactCrossCracks = [];
      impactOutlines = [];
      centers.forEach((point, index) => {
        const settings = impactSettings[index] || getSettings();
        generateCrackCluster(point, seed + settings.randomSeed * 409 + index * 1031, centers, settings);
      });
    }

    function generateCrackCluster(clusterCenter, clusterSeed, allCenters, settings) {
      const s = settings;
      const rnd = mulberry32(clusterSeed);
      const cx = clusterCenter.x;
      const cy = clusterCenter.y;
      const corners = [
        [fit.x, fit.y],
        [fit.x + fit.w, fit.y],
        [fit.x + fit.w, fit.y + fit.h],
        [fit.x, fit.y + fit.h]
      ];
      const maxR = Math.max(...corners.map(([x, y]) => Math.hypot(x - cx, y - cy))) * 1.08;
      const ownsPoint = point => {
        const ownDistance = Math.hypot(point.x - cx, point.y - cy);
        return allCenters.every(other => {
          if (other === clusterCenter) return true;
          return ownDistance <= Math.hypot(point.x - other.x, point.y - other.y) + 1;
        });
      };
      const rayLimit = angle => {
        let limit = maxR;
        const vx = Math.cos(angle);
        const vy = Math.sin(angle);
        for (const other of allCenters) {
          if (other === clusterCenter) continue;
          const dx = other.x - cx;
          const dy = other.y - cy;
          const dot = dx * vx + dy * vy;
          if (dot <= 0) continue;
          const boundary = (dx * dx + dy * dy) / (2 * dot);
          if (boundary > 0) limit = Math.min(limit, boundary * .92);
        }
        return Math.max(limit, Math.min(fit.w, fit.h) * .04);
      };
      const rayCount = s.rayCount;
      const impactNorm = s.impactSize / 20;
      const impactRadius = 1.2 + Math.min(fit.w, fit.h) * (.18 * impactNorm * impactNorm);
      const distanceLayerCount = Math.floor(rnd() * 3);
      const innerRings = [];
      for (let i = 0; i < distanceLayerCount; i++) {
        const spread = (i + 1) / (distanceLayerCount + 1);
        const warped = clamp(spread + (rnd() - .5) * .34, .12, .9);
        innerRings.push(Math.max(impactRadius * 1.8, maxR * (.1 + warped * .78)));
      }
      innerRings.sort((a, b) => a - b);
      const rings = [impactRadius, ...innerRings, maxR * 1.12];
      const rayPoints = [];
      const minAngleGap = Math.PI * 2 / rayCount * .38;
      const angleWeights = [];
      for (let i = 0; i < rayCount; i++) {
        const clusterBias = rnd() > .72 ? .2 + rnd() * .42 : 1;
        angleWeights.push((.35 + Math.pow(rnd(), 2.2) * 2.4) * clusterBias);
      }
      const angleWeightSum = angleWeights.reduce((sum, weight) => sum + weight, 0);
      const flexibleAngle = Math.PI * 2 - minAngleGap * rayCount;
      const rayAngles = [];
      let currentAngle = rnd() * Math.PI * 2;
      for (let i = 0; i < rayCount; i++) {
        const gap = minAngleGap + flexibleAngle * angleWeights[i] / angleWeightSum;
        currentAngle += i ? gap : gap * rnd();
        rayAngles.push(currentAngle);
      }
      const rayStrengths = rayAngles.map(() => .52 + Math.pow(rnd(), 1.7) * 1.25);
      const lowDensityStar = clamp((18 - rayCount) / 9, 0, 1);
      const impactSmoothness = s.impactSmoothness / 100;
      const impactRadii = [];
      for (let i = 0; i < rayCount; i++) {
        const randomRough = .7 + rnd() * .74;
        const spikeRough = rnd() > .48
          ? 1.18 + rnd() * .72
          : .34 + rnd() * .28;
        const offbeatSpike = rnd() > .76 ? 1.42 + rnd() * .72 : spikeRough;
        const jaggedRough = lerp(randomRough, offbeatSpike, lowDensityStar);
        const smoothRough = .92 + rnd() * .16;
        impactRadii.push(impactRadius * lerp(jaggedRough, smoothRough, impactSmoothness));
      }

      for (let i = 0; i < rayCount; i++) {
        const angle = rayAngles[i] + (rnd() - .5) * .045;
        const rayMaxR = rayLimit(angle);
        const length = rayMaxR * (1.02 + rayStrengths[i] * .18 + rnd() * .28);
        const basePath = makeCurvedPath(cx, cy, angle, length, rings.length - 1, rnd, .23 + rnd() * .28);
        const points = [];
        const minGap = Math.max(impactRadius * .6, maxR * .02);
        let previousRadius = impactRadius * 1.18;
        const innerRayRadii = rings.slice(1, -1)
          .map(radius => radius * (.58 + rnd() * .86) + (rnd() - .5) * maxR * .07)
          .sort((a, b) => a - b)
          .map((radius, index, list) => {
            const remaining = list.length - index;
            const ceiling = rayMaxR * 1.02 - minGap * remaining;
            const value = clamp(radius, previousRadius + minGap, ceiling);
            previousRadius = value;
            return value;
          });
        const rayRings = [
          impactRadii[i],
          ...innerRayRadii,
          rayMaxR * (1.08 + rnd() * .14)
        ];
        for (let r = 0; r < rings.length; r++) {
          const t = rayRings[r] / rayMaxR;
          const point = pointOnPath(basePath, Math.min(1, t / 1.12));
          if (r === 0) {
            point.x = cx + Math.cos(angle) * rayRings[r];
            point.y = cy + Math.sin(angle) * rayRings[r];
          }
          points.push(point);
        }
        rayPoints.push(points);
      }

      impactOutlines.push({ points: rayPoints.map(points => points[0]), settings: s });

      for (let i = 0; i < rayCount; i++) {
        const next = (i + 1) % rayCount;
        for (let r = 0; r < rings.length - 1; r++) {
          const poly = [
            rayPoints[i][r],
            rayPoints[i][r + 1],
            rayPoints[next][r + 1],
            rayPoints[next][r]
          ];
          const mid = centroid(poly);
          if (!ownsPoint(mid)) continue;
          const dx = mid.x - cx;
          const dy = mid.y - cy;
          const distNorm = clamp(Math.hypot(dx, dy) / maxR, 0, 1);
          const push = s.breakPower * (.18 + distNorm) * (.45 + rnd());
          const dir = Math.atan2(dy, dx);
          shards.push({
            poly,
            center: clusterCenter,
            settings: s,
            tx: Math.cos(dir) * push + (rnd() - .5) * s.breakPower * .45,
            ty: Math.sin(dir) * push + (rnd() - .5) * s.breakPower * .45,
            rot: (rnd() - .5) * .028 * (1 + distNorm),
            shine: rnd(),
            dark: rnd() * .18
          });
        }
      }

      for (let i = 0; i < rayCount; i++) {
        crackPaths.push({
          points: rayPoints[i],
          center: clusterCenter,
          settings: s,
          kind: rayStrengths[i] > 1.28 ? 'major' : 'radial',
          weight: .34 + Math.pow(rayStrengths[i], 1.35) * .9 + rnd() * .38
        });
        if (rnd() > .35) {
          const start = pointOnPath(rayPoints[i], .18 + rnd() * .46);
          const baseAngle = Math.atan2(start.y - cy, start.x - cx);
          const branchAngle = baseAngle + (rnd() > .5 ? 1 : -1) * (.24 + rnd() * .42);
          const branchLen = maxR * (.08 + rnd() * .2);
          const branch = makeCurvedPath(start.x, start.y, branchAngle, branchLen, 3 + Math.floor(rnd() * 3), rnd, .18 + rnd() * .3);
          crackPaths.push({ points: branch, center: clusterCenter, settings: s, kind: 'branch', weight: .38 + rnd() * .48 });
        }
      }

      const webCount = Math.floor(rayCount * .48);
      for (let i = 0; i < webCount; i++) {
        const a = Math.floor(rnd() * rayCount);
        const b = (a + (rnd() > .5 ? 1 : rayCount - 1)) % rayCount;
        const t1 = .08 + rnd() * .46;
        const t2 = clamp(t1 + (rnd() - .5) * .07, .07, .58);
        const p1 = pointOnPath(rayPoints[a], t1);
        const p2 = pointOnPath(rayPoints[b], t2);
        if (Math.hypot(p2.x - p1.x, p2.y - p1.y) > maxR * .22) continue;
        const angle1 = Math.atan2(p1.y - cy, p1.x - cx);
        const angle2 = Math.atan2(p2.y - cy, p2.x - cx);
        const midAngle = Math.atan2(Math.sin(angle1) + Math.sin(angle2), Math.cos(angle1) + Math.cos(angle2));
        const midR = (Math.hypot(p1.x - cx, p1.y - cy) + Math.hypot(p2.x - cx, p2.y - cy)) * .5;
        const mid = {
          x: cx + Math.cos(midAngle) * midR * (.96 + (rnd() - .5) * .06),
          y: cy + Math.sin(midAngle) * midR * (.96 + (rnd() - .5) * .06)
        };
        crackPaths.push({ points: [p1, mid, p2], center: clusterCenter, settings: s, kind: 'web', weight: .18 + rnd() * .26 });
      }

      const impactCrossCount = Math.floor(rayCount * (1.05 + s.impactSize / 18));
      for (let i = 0; i < impactCrossCount; i++) {
        const a = Math.floor(rnd() * rayCount);
        const b = (a + (rnd() > .5 ? 1 : rayCount - 1)) % rayCount;
        const nearBias = Math.pow(rnd(), 1.9);
        const t1 = .008 + nearBias * .18;
        const t2 = clamp(t1 + (rnd() - .5) * (.035 + nearBias * .035), .006, .24);
        const p1 = pointOnPath(rayPoints[a], t1);
        const p2 = pointOnPath(rayPoints[b], t2);
        const len = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        if (len > impactRadius * (3.15 + nearBias * 1.6)) continue;
        const r1 = Math.hypot(p1.x - cx, p1.y - cy);
        const r2 = Math.hypot(p2.x - cx, p2.y - cy);
        const angle1 = Math.atan2(p1.y - cy, p1.x - cx);
        const angle2 = Math.atan2(p2.y - cy, p2.x - cx);
        const midAngle = Math.atan2(Math.sin(angle1) + Math.sin(angle2), Math.cos(angle1) + Math.cos(angle2));
        const midR = (r1 + r2) * (.5 + (rnd() - .5) * .08);
        const mid = {
          x: cx + Math.cos(midAngle) * midR,
          y: cy + Math.sin(midAngle) * midR
        };
        impactCrossCracks.push({
          points: [p1, mid, p2],
          center: clusterCenter,
          settings: s,
          kind: 'impact-cross',
          weight: .34 + rnd() * .9
        });
      }
    }

    function centroid(poly) {
      return poly.reduce((acc, p) => {
        acc.x += p.x / poly.length;
        acc.y += p.y / poly.length;
        return acc;
      }, { x: 0, y: 0 });
    }

    function drawImageFitted() {
      if (!sourceImage || !fit) return;
      ctx.drawImage(sourceImage, fit.x, fit.y, fit.w, fit.h);
    }

    function clipImageWithTransform(poly, shard, aberration) {
      const c = centroid(poly);
      ctx.save();
      ctx.beginPath();
      poly.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
      ctx.closePath();
      ctx.clip();
      ctx.translate(c.x + shard.tx, c.y + shard.ty);
      ctx.rotate(shard.rot);
      ctx.translate(-c.x, -c.y);

      if (aberration > 0) {
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = .25;
        ctx.drawImage(sourceImage, fit.x + aberration * .5, fit.y, fit.w, fit.h);
        ctx.globalCompositeOperation = 'screen';
        ctx.globalAlpha = .18;
        ctx.drawImage(sourceImage, fit.x - aberration, fit.y + aberration * .35, fit.w, fit.h);
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
      }

      ctx.drawImage(sourceImage, fit.x, fit.y, fit.w, fit.h);

      const grad = ctx.createLinearGradient(c.x - 80, c.y - 80, c.x + 120, c.y + 140);
      grad.addColorStop(0, `rgba(255,255,255,${.04 + shard.shine * .12})`);
      grad.addColorStop(.45, 'rgba(255,255,255,0)');
      grad.addColorStop(1, `rgba(0,0,0,${shard.dark})`);
      ctx.fillStyle = grad;
      ctx.fillRect(fit.x - 20, fit.y - 20, fit.w + 40, fit.h + 40);
      ctx.restore();
    }

    function lineColors() {
      return { core: controls.crackColor.value };
    }

    function drawPolyline(points) {
      points.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    }

    function stableNoise(value) {
      return Math.abs(Math.sin(value * 12.9898 + seed * .071) * 43758.5453) % 1;
    }

    function smoothstep(t) {
      return t * t * (3 - 2 * t);
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function drawSegment(a, b, offsetX, offsetY, strokeStyle, lineWidth) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      const overlap = Math.min(4.5, Math.max(.9, lineWidth * .78));
      const ex = dx / len * overlap;
      const ey = dy / len * overlap;
      ctx.beginPath();
      ctx.moveTo(a.x - ex + offsetX, a.y - ey + offsetY);
      ctx.lineTo(b.x + ex + offsetX, b.y + ey + offsetY);
      ctx.strokeStyle = strokeStyle;
      ctx.lineWidth = lineWidth;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    function drawCrackPath(crack, width, colors, glowAmount) {
      const points = Array.isArray(crack) ? crack : crack.points;
      if (points.length < 2) return;
      const kind = Array.isArray(crack) ? 'radial' : crack.kind;
      const weight = Array.isArray(crack) ? 1 : crack.weight;
      const crackCenter = Array.isArray(crack) ? center : (crack.center || center);
      const kindScale = kind === 'major' ? 1.46 : kind === 'web' ? .52 : kind === 'impact-cross' ? .72 : kind === 'branch' ? .7 : 1;
      const mainWidth = Math.max(.55, width * kindScale * weight);
      const maxDim = Math.max(fit.w, fit.h);
      const nodeWidths = points.map((p, index) => {
        const distanceFromCenter = crackCenter ? Math.hypot(p.x - crackCenter.x, p.y - crackCenter.y) : maxDim;
        const solidFineKind = ['web', 'impact-cross', 'branch'].includes(kind);
        const normalizedDistance = clamp(distanceFromCenter / (maxDim * .44), 0, 1);
        const taper = solidFineKind ? (kind === 'impact-cross' ? .88 : .95) : clamp(Math.pow(normalizedDistance, 1.48), .028, 1);
        const lowFreq = stableNoise(index * 1.73 + p.x * .003 + p.y * .004);
        const highFreq = stableNoise(index * 7.11 + p.x * .011 + p.y * .009);
        const crackNoise = Array.isArray(crack) ? .5 : stableNoise((crack.weight || 1) * 13.7 + points.length * 2.9);
        const randomWidth = solidFineKind
          ? (kind === 'impact-cross' ? .72 + highFreq * .58 : 1)
          : .54 + lowFreq * .76 + (highFreq - .5) * .18 + crackNoise * .34;
        return Math.max(solidFineKind ? .22 : .08, mainWidth * taper * randomWidth);
      });
      for (let i = 1; i < nodeWidths.length - 1; i++) {
        nodeWidths[i] = nodeWidths[i - 1] * .24 + nodeWidths[i] * .52 + nodeWidths[i + 1] * .24;
      }
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      for (let i = 1; i < points.length; i++) {
        const a = points[i - 1];
        const b = points[i];
        const len = Math.hypot(b.x - a.x, b.y - a.y);
        const steps = clamp(Math.ceil(len / 18), 5, 18);
        for (let step = 0; step < steps; step++) {
          const t0 = step / steps;
          const t1 = (step + 1) / steps;
          const tm = smoothstep((t0 + t1) * .5);
          const p0 = pointOnSegment(a, b, t0);
          const p1 = pointOnSegment(a, b, t1);
          const pathT = (i - 1 + (t0 + t1) * .5) / (points.length - 1);
          const endFade = ['web', 'impact-cross', 'branch'].includes(kind) ? 1 : clamp((1 - pathT) / .14, .16, 1);
          const segmentWidth = Math.max(.24, lerp(nodeWidths[i - 1], nodeWidths[i], tm) * endFade);
          drawSegment(p0, p1, 0, 0, colors.core, segmentWidth);
        }
      }
      ctx.restore();
    }

    function drawCrackRoot(crack, width, color) {
      if (Array.isArray(crack) || !['major', 'radial'].includes(crack.kind) || crack.points.length < 2) return;
      const a = crack.points[0];
      const b = crack.points[1];
      const mid = pointOnSegment(a, b, .58);
      ctx.save();
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(mid.x, mid.y);
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(.42, width * .58 * crack.weight);
      ctx.stroke();
      ctx.restore();
    }

    function drawImpactOutline(points, width, color) {
      if (!points || points.length < 3) return;
      ctx.save();
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.beginPath();
      points.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
      ctx.closePath();
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(.24, width * .12);
      ctx.stroke();
      ctx.restore();
    }

    function drawImpactHole(points, color) {
      if (!points || points.length < 3) return;
      ctx.save();
      ctx.beginPath();
      points.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.restore();
    }

    function drawIrregularShardHighlights(shards, amount) {
      if (amount <= 0) return;
      const solidHighlightColor = getSelectedSettings().crackColor || '#ffffff';
      const clusterCount = Math.floor(stableNoise(seed * .013 + amount * .17) * 3);
      ctx.save();
      ctx.globalAlpha = 1;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (let cluster = 0; cluster < clusterCount; cluster++) {
        const key = seed * .019 + cluster * 43.17 + amount * .11;
        const baseAngle = stableNoise(key) * Math.PI * 2;
        const spokeCount = 3 + Math.floor(stableNoise(key + 3.1) * 5);
        const innerR = Math.max(8, Math.min(fit.w, fit.h) * (.08 + stableNoise(key + 6.2) * .18));
        const cx = center.x + (stableNoise(key + 9.3) - .5) * fit.w * .4;
        const cy = center.y + (stableNoise(key + 12.4) - .5) * fit.h * .4;

        for (let i = 0; i < spokeCount; i++) {
          const angle = baseAngle + i * Math.PI * 2 / spokeCount + (stableNoise(key + i * 2.7) - .5) * .7;
          const startR = innerR * (.35 + stableNoise(key + i * 5.1) * .75);
          const endR = innerR * (1.15 + stableNoise(key + i * 7.3) * 2.7);
          const bend = (stableNoise(key + i * 11.6) - .5) * innerR * .45;
          const p0 = {
            x: cx + Math.cos(angle) * startR,
            y: cy + Math.sin(angle) * startR
          };
          const p1 = {
            x: cx + Math.cos(angle) * endR + Math.cos(angle + Math.PI / 2) * bend,
            y: cy + Math.sin(angle) * endR + Math.sin(angle + Math.PI / 2) * bend
          };
          ctx.beginPath();
          ctx.moveTo(p0.x, p0.y);
          ctx.lineTo(p1.x, p1.y);
          ctx.strokeStyle = solidHighlightColor;
          ctx.lineWidth = .35 + stableNoise(key + i * 17.4) * .9;
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    function draw() {
      updateValues();
      const rect = wrap.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      ctx.fillStyle = '#101114';
      ctx.fillRect(0, 0, rect.width, rect.height);

      if (!sourceImage) {
        dropNote.classList.remove('hidden');
        sizeLabel.textContent = '-';
        return;
      }

      dropNote.classList.add('hidden');
      fit = computeFit();
      syncCenterToFit();
      sizeLabel.textContent = `${sourceImage.width} x ${sourceImage.height}`;

      if (!centers.length) {
        drawImageFitted();
        statusEl.textContent = '点击图片上的破碎中心';
        return;
      }

      if (!shards.length) generateCracks();
      const s = getSelectedSettings();

      ctx.save();
      ctx.fillStyle = s.holeColor;
      ctx.fillRect(fit.x - 12, fit.y - 12, fit.w + 24, fit.h + 24);
      ctx.restore();
      if (centers.length > 1) {
        drawImageFitted();
      }

      for (const shard of shards) {
        clipImageWithTransform(shard.poly, shard, (shard.settings || s).aberration);
      }

      ctx.save();
      ctx.beginPath();
      ctx.rect(fit.x, fit.y, fit.w, fit.h);
      ctx.clip();

      drawIrregularShardHighlights(shards, s.edgeGlow);

      crackPaths.forEach(path => {
        const ps = path.settings || s;
        drawCrackPath(path, ps.crackWidth, { core: ps.crackColor }, ps.edgeGlow);
      });
      impactCrossCracks.forEach(path => {
        const ps = path.settings || s;
        drawCrackPath(path, ps.crackWidth, { core: ps.crackColor }, ps.edgeGlow);
      });

      crackPaths.forEach(path => {
        const ps = path.settings || s;
        drawCrackRoot(path, ps.crackWidth, ps.crackColor);
      });
      impactOutlines.forEach(outline => {
        const ps = outline.settings || s;
        drawImpactHole(outline.points, ps.holeColor);
        drawImpactOutline(outline.points, ps.crackWidth, ps.crackColor);
      });
      ctx.restore();

      statusEl.textContent = `破碎点：${centers.length} 个`;
    }

    function loadFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          sourceImage = img;
          fit = computeFit();
          centerRatios = [{ x: .5, y: .5 }];
          impactSettings = [cloneSettings(getSettings())];
          selectedImpactIndex = 0;
          addingImpact = false;
          syncCenterToFit();
          renderImpactTabs();
          setControlsFromSettings(getSelectedSettings());
          seed = Math.floor(Math.random() * 999999);
          shards = [];
          draw();
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    fileInput.addEventListener('change', event => loadFile(event.target.files[0]));

    document.getElementById('loadDemo').addEventListener('click', () => {
      const demo = document.createElement('canvas');
      demo.width = 960;
      demo.height = 1280;
      const d = demo.getContext('2d');
      const bg = d.createLinearGradient(0, 0, demo.width, demo.height);
      bg.addColorStop(0, '#f05365');
      bg.addColorStop(.36, '#1d202a');
      bg.addColorStop(1, '#18c7b9');
      d.fillStyle = bg;
      d.fillRect(0, 0, demo.width, demo.height);
      d.fillStyle = 'rgba(255,255,255,.82)';
      d.beginPath();
      d.ellipse(485, 455, 166, 220, -.08, 0, Math.PI * 2);
      d.fill();
      d.fillStyle = '#222733';
      d.beginPath();
      d.arc(430, 430, 18, 0, Math.PI * 2);
      d.arc(545, 425, 18, 0, Math.PI * 2);
      d.fill();
      d.strokeStyle = '#2d3340';
      d.lineWidth = 12;
      d.beginPath();
      d.moveTo(400, 560);
      d.quadraticCurveTo(485, 620, 575, 558);
      d.stroke();
      d.fillStyle = 'rgba(255,255,255,.62)';
      d.fillRect(250, 740, 470, 380);
      d.fillStyle = 'rgba(0,0,0,.38)';
      d.fillRect(330, 780, 90, 340);
      d.fillRect(560, 780, 86, 340);
      const img = new Image();
      img.onload = () => {
        sourceImage = img;
        fit = computeFit();
        centerRatios = [{ x: .54, y: .36 }];
        impactSettings = [cloneSettings(getSettings())];
        selectedImpactIndex = 0;
        addingImpact = false;
        syncCenterToFit();
        renderImpactTabs();
        setControlsFromSettings(getSelectedSettings());
        seed = Math.floor(Math.random() * 999999);
        shards = [];
        generateCracks();
        draw();
      };
      img.src = demo.toDataURL('image/png');
    });

    wrap.addEventListener('dragover', event => {
      event.preventDefault();
      wrap.style.borderColor = 'rgba(24,199,185,.9)';
    });

    wrap.addEventListener('dragleave', () => {
      wrap.style.borderColor = '#2f3440';
    });

    wrap.addEventListener('drop', event => {
      event.preventDefault();
      wrap.style.borderColor = '#2f3440';
      loadFile(event.dataTransfer.files[0]);
    });

    canvas.addEventListener('click', event => {
      if (!sourceImage) return;
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      if (addingImpact || selectedImpactIndex === -1 || !centers.length) {
        addCenterFromCanvasPoint(x, y);
      } else {
        moveSelectedCenterToCanvasPoint(x, y);
      }
      shards = [];
      generateCracks();
      draw();
    });

    for (const control of Object.values(controls).filter(control => ![controls.crackColor, controls.holeColor].includes(control))) {
      control.addEventListener('input', () => {
        saveSelectedSettings();
        shards = [];
        generateCracks();
        draw();
      });
    }

    document.querySelectorAll('[data-crack]').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('[data-crack]').forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
        crackTone = button.dataset.crack;
        const presetColors = { white: '#ffffff', dark: '#121618', red: '#a41920' };
        controls.crackColor.value = presetColors[crackTone];
        values.crackColor.textContent = controls.crackColor.value;
        saveSelectedSettings();
        shards = [];
        generateCracks();
        draw();
      });
    });

    controls.crackColor.addEventListener('input', () => {
      document.querySelectorAll('[data-crack]').forEach(btn => btn.classList.remove('active'));
      crackTone = 'custom';
      values.crackColor.textContent = controls.crackColor.value;
      saveSelectedSettings();
      shards = [];
      generateCracks();
      draw();
    });

    controls.crackColor.addEventListener('change', () => {
      if (!sourceImage) return;
      values.crackColor.textContent = controls.crackColor.value;
      saveSelectedSettings();
      shards = [];
      generateCracks();
      draw();
    });

    controls.holeColor.addEventListener('input', () => {
      values.holeColor.textContent = controls.holeColor.value;
      saveSelectedSettings();
      shards = [];
      generateCracks();
      draw();
    });

    controls.holeColor.addEventListener('change', () => {
      values.holeColor.textContent = controls.holeColor.value;
      saveSelectedSettings();
      shards = [];
      generateCracks();
      draw();
    });

    addImpact.addEventListener('click', () => {
      addingImpact = true;
      selectedImpactIndex = -1;
      setControlsFromSettings(getSelectedSettings());
      renderImpactTabs();
      statusEl.textContent = '点击画面放置新破碎点';
    });

    deleteImpact.addEventListener('click', () => {
      if (centers.length <= 1 || selectedImpactIndex < 0) return;
      centerRatios.splice(selectedImpactIndex, 1);
      impactSettings.splice(selectedImpactIndex, 1);
      selectedImpactIndex = Math.min(selectedImpactIndex, centerRatios.length - 1);
      addingImpact = false;
      syncCenterToFit();
      center = centers[selectedImpactIndex] || null;
      setControlsFromSettings(getSelectedSettings());
      renderImpactTabs();
      seed = Math.floor(Math.random() * 999999);
      shards = [];
      generateCracks();
      draw();
    });

    document.getElementById('randomize').addEventListener('click', () => {
      if (!sourceImage) return;
      if (selectedImpactIndex === -1) {
        impactSettings = impactSettings.map(settings => ({
          ...settings,
          randomSeed: 1 + Math.floor(Math.random() * 999)
        }));
      } else if (impactSettings[selectedImpactIndex]) {
        impactSettings[selectedImpactIndex].randomSeed = 1 + Math.floor(Math.random() * 999);
      }
      setControlsFromSettings(getSelectedSettings());
      shards = [];
      generateCracks();
      draw();
    });

    document.getElementById('download').addEventListener('click', () => {
      if (!sourceImage) return;
      const link = document.createElement('a');
      link.download = 'broken-mirror-effect.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    window.addEventListener('resize', () => {
      fit = computeFit();
      syncCenterToFit();
      shards = [];
      generateCracks();
      scheduleResizeCanvas();
    });

    renderImpactTabs();
    updateValues();
    resizeCanvas();
    new ResizeObserver(scheduleResizeCanvas).observe(wrap);
  </script>
</body>
</html>
